name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shaders are Kotlin strings, so the Android build never looks inside
  # them: a typo in the GLSL compiles fine here and shows up on the phone as a
  # black screen. Headless Chromium speaks the same GLSL ES 3.00 the driver
  # does, so this compiles every program for real and measures what the ring
  # and point shaders put on screen. It runs beside the build, not before it,
  # so a flake in the browser install never costs us the APK.
  shaders:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install a browser to compile against
        run: |
          set -o pipefail
          node -v 2>&1 | tee -a shader-output.txt
          npm -v 2>&1 | tee -a shader-output.txt
          npm init -y 2>&1 | tee -a shader-output.txt
          npm install --no-save playwright@1.49.1 2>&1 | tee -a shader-output.txt
          npx --yes playwright install --with-deps chromium 2>&1 | tee -a shader-output.txt

      - name: Compile and link every shader
        run: |
          set -o pipefail
          node tools/glslcheck.js 2>&1 | tee -a shader-output.txt

      - name: Measure what the shaders draw
        run: |
          set -o pipefail
          node tools/glslpixels.js 2>&1 | tee -a shader-output.txt

      # Same reason as the build job: the log archive is not reachable from
      # every network, so the failure comes back on the commit instead.
      - name: Report failure on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Shader check failed'
            echo
            echo '```'
            tail -80 shader-output.txt 2>/dev/null || echo '(no output captured)'
            echo '```'
          } > shader-failure.md
          head -c 60000 shader-failure.md > shader-failure-trimmed.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat shader-failure-trimmed.md)" > /dev/null
          echo "Posted shader failure details as a commit comment."

  # Pictures of every screen, rendered on the runner with Robolectric and
  # uploaded as an artifact. Beside the build, never blocking it.
  screens:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Render the screens
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest -Pscreens --rerun 2>&1 | tee screens-output.txt

      # The artifact store is not reachable from every network; a release
      # asset is. A pre-release, so "latest" still means the newest APK.
      - name: Publish the pictures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/build/screens
          cp screens-output.txt app/build/screens/ 2>/dev/null || true
          (cd app/build && zip -qr ../../screens.zip screens)
          gh release view screens >/dev/null 2>&1 || \
            gh release create screens --prerelease --title "Screen pictures" --notes "Rendered by CI for review; not an app build."
          gh release upload screens screens.zip --clobber

      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: |
            app/build/screens/
            app/build/reports/tests/
            screens-output.txt
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-24.04
    env:
      # Job-level env so that steps can test for the secret in an `if:`
      # (the `secrets` context itself is not available in step conditions).
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      HYPNOTICA_VERSION_CODE: ${{ github.run_number }}
      HYPNOTICA_VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Ten ahead of the run number: builds made off CI (0.1.241 to 0.1.245,
      # during the polish loops) must not outrank the next CI build, or the
      # phone refuses it as a downgrade.
      - name: Version
        run: |
          echo "HYPNOTICA_VERSION_CODE=$(( ${{ github.run_number }} + 10 ))" >> "$GITHUB_ENV"

      - name: Use custom signing key if configured
        if: env.KEYSTORE_B64 != ''
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/custom.jks"
          {
            echo "HYPNOTICA_KEYSTORE=$RUNNER_TEMP/custom.jks"
            echo "HYPNOTICA_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "HYPNOTICA_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "HYPNOTICA_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        id: tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee build-output.txt

      - name: Build release APK
        id: assemble
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee -a build-output.txt

      # The raw log archive is not reachable from every network, so failures are
      # echoed back onto the commit where the API can read them.
      - name: Report failure on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Build failed'
            echo
            echo 'Compiler errors:'
            echo '```'
            grep -A3 -E "^e: |error:" build-output.txt | head -120 || echo '(none found)'
            echo '```'
            echo 'Failing tests:'
            echo '```'
            grep -E "FAILED|AssertionError|expected:|Exception" build-output.txt | head -40 || echo '(none found)'
            echo '```'
            echo 'Tail:'
            echo '```'
            tail -60 build-output.txt
            echo '```'
          } > failure.md
          # Commit comments cap out well below this; keep it comfortably short.
          head -c 60000 failure.md > failure-trimmed.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat failure-trimmed.md)" > /dev/null
          echo "Posted failure details as a commit comment."

      - name: Collect APK
        id: collect
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "No APK produced" >&2; exit 1; fi
          DEST="out/hypnotica-${HYPNOTICA_VERSION_NAME}.apk"
          cp "$APK" "$DEST"
          ls -la out
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"

      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "${{ steps.collect.outputs.apk }}"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hypnotica-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${HYPNOTICA_VERSION_NAME}"
          cat > notes.md <<'EOF'
          Automatic build of the latest commit on `main`.

          **Install:** open this page on your phone, download the APK below and tap it.
          Android asks once for permission to install from your browser.

          Signed with the repo's public personal keystore, so each build installs over the last one.
          EOF
          gh release create "$TAG" "${{ steps.collect.outputs.apk }}" \
            --title "Hypnotica $TAG" --notes-file notes.md --latest
